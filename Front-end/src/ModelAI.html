<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Use the Model</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div class="bg-white p-8 rounded-2xl shadow-lg max-w-xl w-full">
    <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">🧠 Try the Model</h1>

    <!-- Form -->
    <form action="/model" method="POST" class="space-y-4">
      <textarea name="text" rows="4"
                class="w-full p-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                placeholder="Type your text here..." required></textarea>

      <button type="submit"
              class="w-full px-6 py-3 bg-blue-600 text-white font-semibold rounded-lg shadow hover:bg-blue-700 transition duration-300">
        Generate
      </button>
    </form>

    <!-- Return Button -->
    <a href="/"
       class="block w-full mt-4 px-6 py-3 bg-gray-600 text-white text-center font-semibold rounded-lg shadow hover:bg-gray-700 transition duration-300">
      ⬅ Return
    </a>

    <!-- Result JSON -->
    {% if result %}
      <div class="mt-6 p-4 bg-gray-50 border rounded-lg text-gray-700 whitespace-pre-wrap">
        <strong>Result JSON:</strong>
        <pre>{{ result | tojson(indent=2) }}</pre>
      </div>
    {% else %}
      <div class="mt-6 p-4 bg-gray-50 border rounded-lg text-gray-700">
        Your result will appear here...
      </div>
    {% endif %}

  </div>

</body>
</html>
